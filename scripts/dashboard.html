<!DOCTYPE html>
<html>
<head>
    <title>AEGIS Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        body { background: #0a0a0a; color: #0f0; font-family: monospace; padding: 20px; }
        h1 { border-bottom: 2px solid #0f0; }
        #status { font-size: 24px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>AEGIS — Ionospheric Risk Dashboard</h1>
    <div id="status">Loading...</div>
    <canvas id="chart" width="800" height="300"></canvas>

    <script>
    const stations = ["IISC", "IITK", "DRDN"];
    const statusDiv = document.getElementById("status");
    statusDiv.innerHTML = "";

    stations.forEach(station => {
        fetch(`http://127.0.0.1:5000/predict/${station}`)
            .then(res => res.json())
            .then(data => {
                const line = document.createElement("div");
                const color = data.risk === "Red" ? "#f00" : data.risk === "Yellow" ? "#ff0" : "#0f0";
                line.innerHTML = `${data.station} | +1h disturbance: ${data.predicted_disturbance_1h.toFixed(2)} TECU | <span style="color:${color}">${data.risk}</span>`;
                statusDiv.appendChild(line);
            })
            .catch(err => {
                statusDiv.innerHTML += `<div>${station} - error loading</div>`;
            });
    });
</script>
</body>
</html>
