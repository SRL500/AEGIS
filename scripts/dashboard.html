<!DOCTYPE html>
<html>
<head>
    <title>AEGIS Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        body { background: #0a0a0a; color: #0f0; font-family: monospace; padding: 20px; }
        h1 { border-bottom: 2px solid #0f0; }
        #status { font-size: 24px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>AEGIS — Ionospheric Risk Dashboard</h1>
    <div id="status">Loading...</div>
    <canvas id="chart" width="800" height="300"></canvas>

<script>
    const stations = ["hyderabad", "bangalore", "lucknow", "colombo"];
    const statusDiv = document.getElementById("status");
    statusDiv.innerHTML = "";

    fetch("http://127.0.0.1:5000/forecast/all")
        .then(res => res.json())
        .then(data => {
            data.forEach(entry => {
                const color = entry.risk === "Red" ? "#f00" : entry.risk === "Yellow" ? "#ff0" : "#0f0";
                const line = document.createElement("div");
                line.style.marginBottom = "8px";
                line.innerHTML = `<b>${entry.station.toUpperCase()}</b> +${entry.horizon} |
                    XGB: ${entry.xgb_pred_latest.toFixed(2)} TECU |
                    Confidence: ${(entry.confidence * 100).toFixed(0)}% |
                    <span style="color:${color}">${entry.risk}</span>
                    <div style="font-size:12px; color:#888;">${entry.action}</div>`;
                statusDiv.appendChild(line);
            });
        })
        .catch(err => {
            statusDiv.innerHTML = "Error loading forecasts — is app_v2.py running?";
        });
</script>
</body>
</html>
